<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLS Virtual Advisor · University of Illinois</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --uiuc-blue: #13294B;
      --uiuc-orange: #FF5F05;
      --uiuc-blue-30: #2F4668;
      --uiuc-blue-80: #B5C8E2;
      --uiuc-blue-90: #E1E7F1;
      --uiuc-storm-30: #474948;
      --uiuc-storm-95: #F4F4F4;
      --uiuc-white: #FFFFFF;
      --navy: var(--uiuc-blue);
      --navy-dark: #0E0F20;
      --navy-light: #1D58A7;
      --orange: var(--uiuc-orange);
      --orange-dark: #C84113;
      --bg: var(--uiuc-storm-95);
      --card: var(--uiuc-white);
      --border: #D7D8D8;
      --text: #252525;
      --muted: #707372;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout ───────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 16px;
    }

    /* ── Top bar ──────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      margin-bottom: 4px;
      border-radius: 16px;
      background: var(--uiuc-blue);
      color: var(--uiuc-white);
      flex-shrink: 0;
    }
    .topbar-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--navy-light), var(--navy));
      border-bottom: 4px solid var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(19,41,75,0.25);
    }
    .topbar-text { flex: 1; }
    .topbar-title {
      font-size: 1.05em;
      font-weight: 700;
      color: var(--uiuc-white);
      letter-spacing: -0.01em;
    }
    .topbar-sub { font-size: 0.78em; color: var(--uiuc-white); margin-top: 1px; }
    .online-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--uiuc-white);
      border: 1px solid var(--uiuc-white);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.75em;
      font-weight: 600;
      color: var(--uiuc-blue);
      flex-shrink: 0;
    }
    .online-dot {
      width: 7px;
      height: 7px;
      background: var(--uiuc-orange);
      border-radius: 50%;
      animation: online-pulse 2.5s ease-in-out infinite;
    }
    @keyframes online-pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ── Chat card ────────────────────────────────────── */
    .chat-card {
      flex: 1;
      background: var(--uiuc-storm-95);
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Agent pipeline bar ───────────────────────────── */
    #agent-bar {
      background: #f4f4f4;
      border-bottom: 1px solid var(--border);
      box-shadow: inset 4px 0 0 var(--orange);
      padding: 10px 20px;
      display: none;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }
    #agent-bar.visible { display: flex; }

    .pipeline { display: flex; align-items: center; flex: 1; }
    .agent-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.79em;
      font-weight: 600;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .chip-a { background: rgba(19,41,75,0.08); color: var(--navy); opacity: 0.35; }
    .chip-b { background: rgba(255,95,5,0.11); color: var(--orange-dark); opacity: 0.35; }
    .agent-chip.is-active { opacity: 1; }
    .agent-chip.is-done   { opacity: 0.5; }

    .chip-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .agent-chip.is-active .chip-dot {
      animation: dot-pulse 0.9s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }

    .pipe-sep { color: #94a3b8; padding: 0 8px; font-size: 0.9em; }

    .agent-desc {
      flex: 1;
      text-align: right;
      font-size: 0.76em;
      color: var(--muted);
      padding-left: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Messages ─────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--uiuc-storm-95);
      scroll-behavior: auto;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #dde3ee; border-radius: 3px; }

    .msg-row { display: flex; flex-direction: column; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.bot  { align-items: flex-start; }

    .message {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.9em;
      line-height: 1.6;
      word-break: break-word;
    }
    .bot-msg {
      background: var(--uiuc-white);
      color: var(--uiuc-blue);
      border: 1px solid #e8edf5;
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .bot-msg p { margin: 0 0 8px; }
    .bot-msg p:last-child { margin-bottom: 0; }
    .bot-msg ul, .bot-msg ol { margin: 6px 0 8px 20px; }
    .bot-msg li { margin-bottom: 4px; }
    .bot-msg strong { color: #0f172a; }
    .bot-msg a { color: var(--navy); }
    .bot-msg code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px; font-size: 0.88em; }

    .user-msg {
      background: var(--uiuc-blue-90);
      color: var(--uiuc-blue);
      font-weight: 600;
      border: 1px solid var(--uiuc-blue-80);
      border-radius: 18px 4px 18px 18px;
      box-shadow: none;
    }

    .msg-time {
      font-size: 0.7em;
      color: var(--uiuc-storm-30);
      margin-top: 5px;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing-bubble {
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-bubble > .typing-dot {
      display: block;
      flex: 0 0 auto;
      width: 7px; height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      will-change: transform, opacity;
      animation: typing-wave-bounce 1.2s ease-in-out infinite both;
    }
    .typing-bubble > .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-bubble > .typing-dot:nth-child(2) { animation-delay: 0.16s; }
    .typing-bubble > .typing-dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes typing-wave-bounce {
      0%, 60%, 100% { transform: translateY(0) scale(0.82); opacity: 0.45; }
      30% { transform: translateY(-8px) scale(1); opacity: 1; }
    }

    /* Stream cursor */
    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #475569;
      vertical-align: text-bottom;
      margin-left: 2px;
      border-radius: 1px;
      animation: cursor-blink 0.75s ease-in-out infinite;
    }
    @keyframes cursor-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* Quick chips */
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .q-chip {
      padding: 7px 14px;
      border: 1px solid var(--uiuc-blue-30);
      border-radius: 20px;
      font-size: 0.82em;
      color: var(--uiuc-blue);
      background: var(--uiuc-white);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
      line-height: 1.3;
    }
    .q-chip:hover {
      border-color: var(--uiuc-blue-30);
      color: var(--uiuc-blue);
      background: var(--uiuc-blue-90);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(19,41,75,0.1);
    }

    /* ── Input area ───────────────────────────────────── */
    .input-area {
      position: relative;
      border-top: 1px solid var(--border);
      background: white;
      padding: 14px 20px 16px;
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid var(--uiuc-blue-30);
      border-radius: 14px;
      font-size: 0.9em;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.5;
      color: var(--uiuc-blue);
      background: var(--uiuc-white);
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }
    #user-input:focus {
      border-color: var(--uiuc-blue-30);
      background: var(--uiuc-white);
      box-shadow: none;
    }
    #user-input::placeholder { color: var(--uiuc-storm-30); opacity: 1; }

    .send-btn {
      height: 44px;
      padding: 0 20px;
      background: var(--uiuc-blue);
      color: var(--uiuc-white);
      border: none;
      border-radius: 14px;
      font-size: 0.88em;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(19,41,75,0.2);
    }
    .send-btn:hover:not(:disabled) {
      background: var(--uiuc-blue-30);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(19,41,75,0.3);
    }
    .send-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }

    .input-hint {
      margin-top: 8px;
      font-size: 0.72em;
      color: var(--uiuc-storm-30);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-hint a { color: var(--navy); text-decoration: none; }
    .input-hint a:hover { text-decoration: underline; }
    .input-hint kbd {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.9em;
      font-family: inherit;
    }
    .new-message-pill {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 6px 14px;
      border: 1px solid #2F4668;
      border-radius: 999px;
      background: #13294B;
      color: #FFFFFF;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(19, 41, 75, 0.2);
    }
    .new-message-pill:hover {
      background: #1D3B6B;
    }
    .new-message-pill:focus-visible {
      outline: 3px solid #FF5F05;
      outline-offset: 2px;
    }
    .new-message-pill[hidden] {
      display: none;
    }
    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--uiuc-orange);
      outline-offset: 3px;
    }
    @media (max-width: 520px) {
      .app { padding: 0 8px 8px; }
      .topbar { gap: 10px; padding: 14px 16px; }
      .topbar-title { font-size: 0.98em; }
      .topbar-sub { font-size: 0.72em; }
      .online-badge { padding: 5px 10px; }
      .message { max-width: 86%; }
      .messages { padding: 20px 20px 12px; }
      #user-input { min-height: 58px; }
      .send-btn { height: 58px; }
      .input-hint {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        line-height: 1.35;
      }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo">🎓</div>
    <div class="topbar-text">
      <div class="topbar-title">BLS Virtual Advisor</div>
      <div class="topbar-sub">University of Illinois · Bachelor of Liberal Studies</div>
    </div>
    <div class="online-badge">
      <span class="online-dot"></span>
      AI Online
    </div>
  </div>

  <!-- Chat card -->
  <div class="chat-card">

    <!-- ATLAS request status -->
    <div id="agent-bar">
      <div class="pipeline">
        <div class="agent-chip chip-a" id="chip-a">
          <span class="chip-dot"></span>
          BLS Knowledge Base
        </div>
        <span class="pipe-sep">→</span>
        <div class="agent-chip chip-b" id="chip-b">
          <span class="chip-dot"></span>
          ATLAS Model
        </div>
      </div>
      <div class="agent-desc" id="agent-desc">Processing your question…</div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages"></div>

    <!-- Input -->
    <div class="input-area">
      <button class="new-message-pill" id="new-message-pill" type="button" hidden>
        ↓ New response
      </button>
      <div class="input-row">
        <textarea aria-describedby="input-counter input-error" id="user-input" rows="1" placeholder="Ask about tuition, admissions, transfer credits, concentrations…"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Send
        </button>
      </div>
      <div id="input-counter" aria-live="polite" style="font-size:12px;color:#555"></div>
      <div id="input-error" role="alert" style="font-size:12px;color:#8b2700"></div>
      <div class="input-hint">
        <span>Need more help? <a href="mailto:onlineBLS@illinois.edu">onlineBLS@illinois.edu</a></span>
        <span><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for newline</span>
      </div>
    </div>
  </div>
</div>

<script src="/assets/marked.js"></script>
<script src="/assets/purify.min.js"></script>
<script src="/assets/safe-markdown.js"></script>
<script src="/assets/input-validation.js"></script>
<script>
  const msgsEl   = document.getElementById('messages');
  const inputEl  = document.getElementById('user-input');
  const sendBtn  = document.getElementById('send-btn');
  const newResponsePill = document.getElementById('new-message-pill');
  const agentBar = document.getElementById('agent-bar');
  const chipA    = document.getElementById('chip-a');
  const chipB    = document.getElementById('chip-b');
  const agentDesc= document.getElementById('agent-desc');
  let lastResponse = '';

  let inputConfig = null;
  let submitting = false;
  const counter = document.getElementById('input-counter');
  const inputError = document.getElementById('input-error');
  function updateCounter() {
    if (!inputConfig) { counter.textContent = 'Loading input limit...'; sendBtn.disabled = true; return; }
    const count = BLSInput.count(inputEl.value), limit = inputConfig.max_question_chars;
    const warning = count > limit ? ' - over the limit' : count >= limit * 0.9 ? ' - approaching the limit' : '';
    counter.textContent = `${count.toLocaleString()} / ${limit.toLocaleString()} characters${warning}`;
    sendBtn.disabled = submitting || count > limit;
  }
  inputEl.addEventListener('input', updateCounter);
  fetch('/api/input-config').then(r => { if (!r.ok) throw Error(); return r.json(); }).then(config => {
    if (!Number.isInteger(config.max_question_chars) || config.max_question_chars < 1) throw Error();
    inputConfig = config; updateCounter();
  }).catch(() => { counter.textContent = 'Input limit unavailable.'; inputError.textContent = 'Could not load the advisor settings. Please reload and try again.'; });
  updateCounter();


  // Initial greeting
  appendBot('Hello! I\'m the **BLS Virtual Advisor** — here to answer your questions about the **Bachelor of Liberal Studies** program at the University of Illinois.\n\nAsk me anything about tuition, transfer credits, concentrations, admissions, or how the program works.');
  appendChips(['How much does the BLS program cost?', 'What concentrations are available?', 'I work full-time — can I still do this?', 'How do I apply for next semester?']);

  // Input resize
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  msgsEl.addEventListener('scroll', () => {
    if (isNearBottom()) newResponsePill.hidden = true;
  }, { passive: true });
  newResponsePill.addEventListener('click', () => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    msgsEl.scrollTo({
      top: msgsEl.scrollHeight,
      behavior: prefersReducedMotion ? 'auto' : 'smooth',
    });
    newResponsePill.hidden = true;
  });

  // Agent bar
  function showAgent(agent, desc) {
    const wasNearBottom = isNearBottom();
    agentBar.classList.add('visible');
    chipA.classList.remove('is-active', 'is-done');
    chipB.classList.remove('is-active', 'is-done');
    agent === 'A' ? chipA.classList.add('is-active') : (chipA.classList.add('is-done'), chipB.classList.add('is-active'));
    agentDesc.textContent = desc || 'Processing…';
    if (wasNearBottom) requestAnimationFrame(() => scrollDown());
  }
  function hideAgentBar() {
    agentBar.classList.remove('visible');
    chipA.classList.remove('is-active', 'is-done');
    chipB.classList.remove('is-active', 'is-done');
  }

  // Send
  async function sendMessage() {
    const text = inputEl.value;
    if (!text.trim() || !inputConfig || submitting || BLSInput.count(text) > inputConfig.max_question_chars) return;
    submitting = true; inputEl.disabled = true; inputError.textContent = ''; updateCounter();
    const typingEl = appendTyping();
    try {
      const body = { query: text };
      let omitted = false;
      if (inputConfig.use_last_response && lastResponse) {
        if (BLSInput.count(lastResponse) <= inputConfig.max_previous_response_chars) body.last_response = lastResponse;
        else omitted = true;
      }
      const res = await fetch('/api/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) {
        let data = {}; try { data = await res.json(); } catch {}
        throw new Error(BLSInput.message(res.status, data.code, inputConfig.max_question_chars));
      }
      if (!res.body) throw new Error('The advisor service returned an empty response. Please try again.');
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buf = '', answer = null, failure = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
          if (ev.type === 'agent_status') showAgent(ev.agent, ev.message);
          else if (ev.type === 'answer' && typeof ev.content === 'string') answer = ev.content;
          else if (ev.type === 'error') failure = true;
        }
      }
      if (failure || answer === null) throw new Error('The advisor could not generate a response. Please try again.');
      typingEl.remove(); removeChips(); appendUser(text);
      lastResponse = answer;
      appendBotStreaming(answer);
      inputEl.value = ''; inputEl.style.height = 'auto';
      if (omitted) inputError.textContent = 'The previous answer was too long to include as context. Please repeat any details needed for your follow-up.';
    } catch (error) {
      typingEl.remove();
      inputError.textContent = error instanceof TypeError ? 'Could not connect to the advisor service. Please check your connection and try again.' : (error.message || 'The advisor service is unavailable. Please try again.');
    } finally {
      hideAgentBar(); submitting = false; inputEl.disabled = false; updateCounter(); inputEl.focus();
    }
  }

  function appendUser(text) {
    const row = mk('div', 'msg-row user');
    const msg = mk('div', 'message user-msg');
    msg.textContent = text;
    const t = mk('div', 'msg-time'); t.textContent = now();
    row.append(msg, t);
    msgsEl.appendChild(row);
  }

  function appendBot(md, wasNearBottom = isNearBottom()) {
    const row = mk('div', 'msg-row bot');
    const msg = mk('div', 'message bot-msg');
    msg.innerHTML = safeMarkdown(md);
    const t = mk('div', 'msg-time'); t.textContent = now();
    row.append(msg, t);
    msgsEl.appendChild(row);
    updateReplyScroll(wasNearBottom);
    return row;
  }

  function appendBotStreaming(content, pendingRow = null, wasNearBottom = isNearBottom()) {
    const row = pendingRow?.isConnected ? pendingRow : mk('div', 'msg-row bot');
    const msg = pendingRow?.isConnected ? row.querySelector('.message') : mk('div', 'message bot-msg');
    msg.classList.remove('typing-bubble');
    msg.removeAttribute('role');
    msg.removeAttribute('aria-label');
    msg.removeAttribute('aria-live');
    msg.innerHTML = '';
    if (!pendingRow?.isConnected) msgsEl.appendChild(row);
    if (!row.querySelector('.msg-time')) {
      const t = mk('div', 'msg-time');
      t.textContent = now();
      row.append(msg, t);
    }
    updateReplyScroll(wasNearBottom);

    const chars = [...content];
    let i = 0, acc = '';
    function tick() {
      const wasNearBottom = isNearBottom();
      if (i >= chars.length) {
        msg.innerHTML = safeMarkdown(acc);
        updateReplyScroll(wasNearBottom);
        return;
      }
      const burst = Math.min(5, chars.length - i);
      for (let b = 0; b < burst; b++) acc += chars[i++];
      msg.innerHTML = safeMarkdown(acc) + '<span class="stream-cursor"></span>';
      updateReplyScroll(wasNearBottom);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    return row;
  }

  function appendTyping() {
    const row = mk('div', 'msg-row bot');
    const bubble = mk('div', 'message bot-msg typing-bubble');
    bubble.setAttribute('role', 'status');
    bubble.setAttribute('aria-live', 'polite');
    bubble.setAttribute('aria-label', 'BLS advisor is typing');
    bubble.innerHTML = '<span class="typing-dot" aria-hidden="true"></span><span class="typing-dot" aria-hidden="true"></span><span class="typing-dot" aria-hidden="true"></span>';
    row.appendChild(bubble);
    msgsEl.appendChild(row);
    return row;
  }

  function replaceTypingWithBot(row, md, wasNearBottom = isNearBottom()) {
    if (!row?.isConnected) return appendBot(md, wasNearBottom);
    const msg = row.querySelector('.message');
    msg.classList.remove('typing-bubble');
    msg.removeAttribute('role');
    msg.removeAttribute('aria-label');
    msg.removeAttribute('aria-live');
    msg.innerHTML = safeMarkdown(md);
    if (!row.querySelector('.msg-time')) {
      const t = mk('div', 'msg-time');
      t.textContent = now();
      row.appendChild(t);
    }
    updateReplyScroll(wasNearBottom);
    return row;
  }

  function appendChips(qs) {
    const wrap = mk('div', 'quick-chips'); wrap.id = 'quick-chips';
    qs.forEach(q => {
      const c = mk('button', 'q-chip');
      c.textContent = q;
      c.onclick = () => { inputEl.value = q; sendMessage(); };
      wrap.appendChild(c);
    });
    msgsEl.appendChild(wrap);
    scrollDown();
  }

  function removeChips() { const c = document.getElementById('quick-chips'); if (c) c.remove(); }
  function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function isNearBottom() {
    return msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight <= 60;
  }
  function updateReplyScroll(wasNearBottom) {
    if (wasNearBottom) {
      newResponsePill.hidden = true;
      scrollDown();
    } else {
      newResponsePill.hidden = false;
    }
  }
  function scrollDown(smooth = false) {
    msgsEl.scrollTo({
      top: msgsEl.scrollHeight,
      behavior: smooth ? 'smooth' : 'auto',
    });
  }
  function forceScrollDown() {
    scrollDown();
    requestAnimationFrame(() => scrollDown());
  }
  function now() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
</script>
</body>
</html>
